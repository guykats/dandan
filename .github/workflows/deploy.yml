name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Push code + built assets to deploy branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/build
          git commit -m "Deploy ${{ github.sha }}" --allow-empty
          git push origin HEAD:deploy --force

      - name: Trigger the server to pull and deploy
        run: |
          curl -sf -X POST https://dandan.guykats.com/deploy-webhook \
            -H "Accept: application/json" \
            --max-time 240 \
            -w '\nHTTP %{http_code}\n' \
            || echo "webhook call failed - run deploy/pull-deploy.sh on the server manually"
